[workspace]
members = [
    "crates/solti-prometheus",
    "crates/solti-discover",
    "crates/solti-observe",
    "crates/solti-model",
    "crates/solti-runner",
    "crates/solti-core",
    "crates/solti-exec",
    "crates/solti-api",
    "crates/solti-tls",
    "crates/solti",

    "examples/agentd-http",
    "examples/agentd-grpc",
    "examples/tls-roundtrip",
    "examples/podium",
]
resolver = "2"

[workspace.package]
version      = "0.0.3"
edition      = "2024"
rust-version = "1.90.0"
license      = "Apache-2.0"

repository   = "https://github.com/soltiHQ/sdk"
homepage     = "https://github.com/soltiHQ/sdk"

keywords     = ["async", "tasks", "supervisor", "orchestration", "solti"]
categories   = ["asynchronous", "concurrency"]

[workspace.dependencies]
aide                = { version = "=0.16.0-alpha.4", default-features = false }
anyhow              = "1.0.104"
async-trait         = "0.1.91"
axum                = "0.8.9"
base64              = "0.22.1"
bytes               = "1.12.1"
form_urlencoded     = "1.2.2"
getrandom           = "0.4.3"
http-body-util      = "0.1.4"
itoa                = "1.0.18"
jsonschema          = { version = "0.49.2", default-features = false }
libc                = "0.2.177"
parking_lot         = "0.12.5"
pbjson              = "0.9.0"
pbjson-build        = "0.9.0"
prometheus          = "0.14.0"
prost               = "0.14.4"
prost-reflect       = { version = "0.16.5", default-features = false }
protoc-bin-vendored = { version = "3.2.0" }
rcgen               = "0.14.8"
reqwest             = "0.13.4"
rustls              = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars            = "1.2.2"
seccompiler         = "0.5.0"
serde               = { version = "1.0.229", features = ["derive"] }
serde_json          = "1.0.151"
solti               = { path = "crates/solti",            version = "0.0.3", default-features = false }
solti-api           = { path = "crates/solti-api",        version = "0.0.3", default-features = false }
solti-core          = { path = "crates/solti-core",       version = "0.0.3", default-features = false }
solti-discover      = { path = "crates/solti-discover",   version = "0.0.3", default-features = false }
solti-exec          = { path = "crates/solti-exec",       version = "0.0.3", default-features = false }
solti-model         = { path = "crates/solti-model",      version = "0.0.3", default-features = false }
solti-observe       = { path = "crates/solti-observe",    version = "0.0.3", default-features = false }
solti-prometheus    = { path = "crates/solti-prometheus", version = "0.0.3", default-features = false }
solti-runner        = { path = "crates/solti-runner",     version = "0.0.3", default-features = false }
solti-tls           = { path = "crates/solti-tls",        version = "0.0.3", default-features = false }
subtle              = "2.6.1"
taskvisor           = { version = "0.7.0", default-features = false }
tempfile            = "3.27.0"
thiserror           = "2.0.18"
time                = { version = "0.3.51" }
tokio               = { version = "1.52.3" }
tokio-rustls        = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-stream        = "0.1.18"
tokio-util          = { version = "0.7.18", features = ["rt"] }
tonic               = "0.14.6"
tonic-prost         = "0.14.6"
tonic-prost-build   = "0.14.6"
tower               = "0.5.3"
tower-http          = "0.7.0"
tracing             = "0.1.44"
tracing-journald    = "0.3.2"
tracing-subscriber  = { version = "0.3.23", default-features = false }
zeroize             = "1.8.2"
