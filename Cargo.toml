[workspace]
members = [
    "crates/solti-prometheus",
    "crates/solti-discover",
    "crates/solti-observe",
    "crates/solti-model",
    "crates/solti-runner",
    "crates/solti-core",
    "crates/solti-exec",
    "crates/solti-api",
    "crates/solti-tls",

    "examples/agentd-http",
    "examples/agentd-grpc",
    "examples/tls-roundtrip",
]
resolver = "2"

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0"

repository   = "https://github.com/soltiHQ/sdk"
homepage     = "https://github.com/soltiHQ/sdk"

keywords     = ["async", "tasks", "supervisor", "orchestration", "solti"]
categories   = ["asynchronous", "concurrency"]

[workspace.dependencies]
tokio        = { version = "1.52.3" }
tokio-util   = "0.7.18"
tokio-stream = "0.1.18"
bytes        = "1.11.1"

tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23" }
tracing-journald   = "0.3.2"

serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

anyhow    = "1.0.102"
thiserror = "2.0.18"

async-trait = "0.1.89"
parking_lot = "0.12.5"
time        = { version = "0.3.47" }
base64      = "0.22.1"
libc        = "0.2.177"
hostname    = "0.4.2"
uuid        = "1.23.1"
tempfile    = "3.27.0"
itoa        = "1.0.18"

axum           = "0.8.9"
tower          = "0.5.3"
tower-http     = "0.6.10"
http-body-util = "0.1.3"
reqwest        = "0.13.3"

tonic               = "0.14.6"
tonic-prost         = "0.14.6"
tonic-prost-build   = "0.14.6"
prost               = "0.14.3"
prost-types         = "0.14.3"
protoc-bin-vendored = { version = "3.2.0" }
pbjson              = "0.9.0"
pbjson-build        = "0.9.0"

prometheus = "0.14.0"

rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen          = "0.14.8"
tokio-rustls   = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }

taskvisor = { version = "0.1.2" }

solti-tls        = { path = "crates/solti-tls",        version = "0.0.1" }
solti-model      = { path = "crates/solti-model",      version = "0.0.1" }
solti-runner     = { path = "crates/solti-runner",     version = "0.0.1" }
solti-exec       = { path = "crates/solti-exec",       version = "0.0.1" }
solti-core       = { path = "crates/solti-core",       version = "0.0.1" }
solti-api        = { path = "crates/solti-api",        version = "0.0.1" }
solti-discover   = { path = "crates/solti-discover",   version = "0.0.1" }
solti-observe    = { path = "crates/solti-observe",    version = "0.0.1" }
solti-prometheus = { path = "crates/solti-prometheus", version = "0.0.1" }
