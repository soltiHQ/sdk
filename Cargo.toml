[workspace]
members = [
    "crates/solti-prometheus",
    "crates/solti-discover",
    "crates/solti-observe",
    "crates/solti-model",
    "crates/solti-runner",
    "crates/solti-core",
    "crates/solti-exec",
    "crates/solti-api",

    "examples/agentd-http",
    "examples/agentd-grpc",
]
resolver = "2"

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0"

repository   = "https://github.com/soltiHQ/sdk"
homepage     = "https://github.com/soltiHQ/sdk"

keywords     = ["async", "tasks", "supervisor", "orchestration", "solti"]
categories   = ["asynchronous", "concurrency"]

[workspace.dependencies]
tokio      = { version = "1" }
tokio-util = "0.7.17"

tracing            = "0.1"
tracing-subscriber = { version = "0.3" }
tracing-journald   = "0.3.1"

anyhow      = "1"
thiserror   = "2"
async-trait = "0.1"
parking_lot = "0.12"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
time        = { version = "0.3" }
base64      = "0.22"
libc        = "0.2.177"
hostname    = "0.4.2"
uuid        = "1.19.0"
tempfile    = "3.14"
itoa        = "1"

axum       = "0.8.7"
tower-http = "0.6"
reqwest    = "0.13.1"

tonic               = "0.14.5"
tonic-prost         = "0.14.5"
tonic-prost-build   = "0.14.5"
prost               = "0.14.3"
prost-types         = "0.14.3"
protoc-bin-vendored = { version = "3" }
pbjson              = "0.9.0"
pbjson-build        = "0.9.0"

prometheus = "0.14.0"

taskvisor = { version = "0.1.2" }
