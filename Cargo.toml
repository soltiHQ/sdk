[workspace]
members = [
    "benches",
    "crates/solti",
    "crates/solti-api",
    "crates/solti-chain",
    "crates/solti-core",
    "crates/solti-discover",
    "crates/solti-exec",
    "crates/solti-model",
    "crates/solti-observe",
    "crates/solti-prometheus",
    "crates/solti-runner",
    "crates/solti-tls",
    "tools/docs-tests",
]
resolver = "2"

[workspace.metadata.ci]
clippy-matrix = [
    { package = "solti", features = ["model"] },
    { package = "solti", features = ["model-schema"] },
    { package = "solti", features = ["chain"] },
    { package = "solti", features = ["chain-schema"] },
    { package = "solti", features = ["api-core-adapter", "api-grpc-tls", "exec-subprocess"] },
    { package = "solti", features = ["api-core-adapter", "api-http", "discover-http", "exec-subprocess"] },
    { package = "solti", features = ["chain", "core", "exec-subprocess"] },
    { package = "solti", features = ["core", "exec-containerd"] },
    { package = "solti", features = ["discover-grpc-tls"] },
    { package = "solti", features = ["discover-http-tls"] },
    { package = "solti-api", features = ["grpc"] },
    { package = "solti-api", features = ["grpc-tls"] },
    { package = "solti-api", features = ["http"] },
    { package = "solti-chain", features = ["schema"] },
    { package = "solti-discover", features = ["grpc"] },
    { package = "solti-discover", features = ["grpc", "tls"] },
    { package = "solti-discover", features = ["http"] },
    { package = "solti-discover", features = ["http", "tls"] },
    { package = "solti-exec", features = ["container"] },
    { package = "solti-exec", features = ["containerd"] },
    { package = "solti-exec", features = ["host-process"] },
    { package = "solti-exec", features = ["seccomp"] },
    { package = "solti-exec", features = ["subprocess"] },
    { package = "solti-observe", features = ["full"] },
    { package = "solti-prometheus", features = ["full"] },
]

[workspace.package]
version      = "0.0.6"
edition      = "2024"
rust-version = "1.90.0"
license      = "Apache-2.0"

repository   = "https://github.com/soltiHQ/sdk"
homepage     = "https://github.com/soltiHQ/sdk"

keywords     = ["task", "supervisor", "orchestration", "agent", "tokio"]
categories   = ["asynchronous", "concurrency", "network-programming"]

[workspace.dependencies]
aide                = { version = "=0.16.0-alpha.4", default-features = false }
anyhow              = "1.0.104"
async-trait         = "0.1.92"
axum                = "0.8.9"
base64              = "0.23.1"
bytes               = "1.12.1"
containerd-client   = { version = "0.9.0", default-features = false, features = ["connect"] }
criterion           = "0.8.2"
form_urlencoded     = "1.2.2"
getrandom           = "0.4.3"
http-body-util      = "0.1.4"
itoa                = "1.0.18"
jsonschema          = { version = "0.49.8", default-features = false }
libc                = "0.2.177"
oci-spec            = { version = "0.10.0", default-features = false, features = ["distribution", "image", "runtime"] }
parking_lot         = "0.12.5"
pbjson              = "0.9.0"
pbjson-build        = "0.9.0"
prometheus          = "0.14.0"
prost               = "0.14.4"
prost-types         = "0.14.4"
proptest            = { version = "1.11.0", default-features = false, features = ["std"] }
protoc-bin-vendored = { version = "3.2.0" }
rcgen               = "0.14.8"
reqwest             = { version = "0.13.4", default-features = false }
rustls              = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars            = "1.2.2"
seccompiler         = "0.5.0"
serde               = { version = "1.0.229", features = ["derive"] }
serde_json          = "1.0.151"
sha2                = "0.11.0"
solti               = { path = "crates/solti",            version = "0.0.6", default-features = false }
solti-api           = { path = "crates/solti-api",        version = "0.0.6", default-features = false }
solti-chain         = { path = "crates/solti-chain",      version = "0.0.6", default-features = false }
solti-core          = { path = "crates/solti-core",       version = "0.0.6", default-features = false }
solti-discover      = { path = "crates/solti-discover",   version = "0.0.6", default-features = false }
solti-exec          = { path = "crates/solti-exec",       version = "0.0.6", default-features = false }
solti-model         = { path = "crates/solti-model",      version = "0.0.6", default-features = false }
solti-observe       = { path = "crates/solti-observe",    version = "0.0.6", default-features = false }
solti-prometheus    = { path = "crates/solti-prometheus", version = "0.0.6", default-features = false }
solti-runner        = { path = "crates/solti-runner",     version = "0.0.6", default-features = false }
solti-tls           = { path = "crates/solti-tls",        version = "0.0.6", default-features = false }
subtle              = "2.6.1"
taskvisor           = { version = "0.9.0", default-features = false }
tempfile            = "3.27.0"
thiserror           = "2.0.20"
time                = { version = "0.3.55" }
tokio               = { version = "1.53.1" }
tokio-rustls        = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-stream        = "0.1.19"
tokio-util          = { version = "0.7.19", features = ["rt"] }
tonic               = "0.14.6"
tonic-prost         = "0.14.6"
tonic-prost-build   = "0.14.6"
tower               = "0.5.3"
tower-http          = "0.7.0"
tracing             = "0.1.44"
tracing-journald    = "0.3.2"
tracing-subscriber  = { version = "0.3.23", default-features = false }
zeroize             = "1.9.0"
