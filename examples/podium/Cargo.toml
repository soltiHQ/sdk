[package]
name = "podium"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Both transports compiled in: the active one is chosen at runtime from the TOML config.
solti = { path = "../../crates/solti", features = [
    "api-core-adapter",
    "api-http",
    "api-grpc-tls",
    "discover-http",
    "discover-grpc",
    "discover-tls",
    "exec-subprocess",
    "observe-timezone-sync",
    "prometheus-full",
    "taskvisor-tracing",
] }

tokio       = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing     = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
axum        = { workspace = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tonic       = { workspace = true, features = ["tls-ring", "transport"] }
clap        = { version = "4", features = ["derive"] }
toml        = "0.8"
