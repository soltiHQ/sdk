[package]
name = "podium"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
solti-prometheus = { path = "../../crates/solti-prometheus", features = ["server", "process", "discover", "api", "state"] }
solti-observe    = { path = "../../crates/solti-observe",    features = ["timezone-sync", "subscriber"] }
solti-exec       = { path = "../../crates/solti-exec",       features = ["subprocess"] }
# Both transports compiled in: the active one is chosen at runtime from the TOML config.
solti-api        = { path = "../../crates/solti-api",        features = ["http", "grpc", "tls"] }
solti-discover   = { path = "../../crates/solti-discover",   features = ["http", "grpc", "tls"] }
solti-runner     = { path = "../../crates/solti-runner" }
solti-model      = { path = "../../crates/solti-model" }
solti-core       = { path = "../../crates/solti-core" }
solti-tls        = { path = "../../crates/solti-tls" }

tokio       = { workspace = true, features = ["rt-multi-thread", "signal"] }
taskvisor   = { workspace = true }
tracing     = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
axum        = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tonic       = { workspace = true, features = ["tls-ring", "transport"] }
clap        = { version = "4", features = ["derive"] }
toml        = "0.8"
