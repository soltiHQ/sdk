# Quick-start preset: HTTP, no TLS, no token.
# Pair with podium running plaintext (HTTP discovery on :8082). See README.md.

transport = "http"

[agent]
id        = "podium-agent-001"
name      = "podium-agent"
listen    = "0.0.0.0:8085"      # the agent serves its own TaskService here (podium connects to it)
advertise = "127.0.0.1:8085"    # what podium is told to dial back

[control_plane]
endpoint     = "http://127.0.0.1:8082"   # podium HTTP discovery endpoint
heartbeat_ms = 10000

[task]
enabled = true
name    = "demo-clock"
command = "sh"
args    = ["-c", "while true; do date; sleep 5; done"]
