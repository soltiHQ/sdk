# Full "real" preset: gRPC + mutual TLS + shared bearer token.
# 1) generate the shared CA + certs:  ./certs/gen.sh
# 2) start podium with the matching TLS/token env (see README.md "Full setup").

transport = "grpc"

[agent]
id        = "podium-agent-001"
name      = "podium-agent"
listen    = "[::]:50052"         # agent gRPC TaskService bind
advertise = "127.0.0.1:50052"    # host:port podium dials back (gRPC: bare, no scheme)

[control_plane]
endpoint     = "https://127.0.0.1:50051"   # podium gRPC discovery, over TLS
heartbeat_ms = 10000

[tls]
enabled     = true
ca          = "certs/ca.crt"            # trust podium's server cert; verify podium's client cert (mTLS)
cert        = "certs/agent.crt"         # agent server cert (podium -> agent)
key         = "certs/agent.key"
mtls        = true
client_cert = "certs/agent-client.crt"  # presented to podium on discovery (mTLS)
client_key  = "certs/agent-client.key"

[auth]
enabled = true
token   = "dev-shared-token-CHANGE-ME"  # must equal podium's stored token (trust-on-first-use)

[task]
enabled = true
name    = "demo-clock"
command = "sh"
args    = ["-c", "while true; do date; sleep 5; done"]
