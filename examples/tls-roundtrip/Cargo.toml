[package]
name = "tls-roundtrip"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Solti TLS surface under test.
solti-tls = { path = "../../crates/solti-tls" }
solti-api = { path = "../../crates/solti-api", features = ["grpc", "tls"] }

# Async runtime + tracing.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

# In-memory PKI generation.
rcgen = { workspace = true }

# HTTPS half: axum router + axum-server with rustls.
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

# gRPC half: tonic with TLS + the standard health-check service for a real RPC.
tonic = { workspace = true, features = ["tls-ring", "transport"] }
tonic-health = "0.14"

# HTTPS client.
reqwest = { workspace = true, features = ["rustls-no-provider"] }

# Re-export rustls so we can hand axum-server an `Arc<rustls::ServerConfig>`.
rustls = { workspace = true }

anyhow = { workspace = true }
