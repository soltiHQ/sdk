# Configures GitHub's auto-generated release notes.

changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Dependencies
      labels:
        - dependencies
        - deps
    - title: CI / Build
      labels:
        - ci
        - build
    - title: Other changes
      labels:
        - "*"
