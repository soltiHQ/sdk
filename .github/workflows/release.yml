name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {
  contents: read,
  actions: write
}

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  check-main-branch:
    name: Verify tag from main branch
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure main is fetched
        run: git fetch origin main --depth=1

      - name: Verify tag commit is on main
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          TAG_COMMIT=$(git rev-list -n 1 "$REF")
          git rev-parse --verify origin/main >/dev/null

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag commit is not an ancestor of origin/main"
            exit 1
          fi

      - name: Verify workspace version matches tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_VERSION="${REF_NAME#v}"
          # `[workspace.package].version` is the single source of truth;
          # every crate inherits it via `version.workspace = true`.
          FILE_VERSION=$(awk '
            /^\[workspace.package\]/ { in_section=1; next }
            /^\[/ { in_section=0 }
            in_section && /^\s*version\s*=/ {
              match($0, /"([^"]+)"/, m); print m[1]; exit
            }
          ' Cargo.toml)

          if [ -z "$FILE_VERSION" ] || [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "workspace.package.version ($FILE_VERSION) must equal tag ($TAG_VERSION, from '$REF_NAME')"
            exit 1
          fi

  publish-crates:
    needs: check-main-branch
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace in dep-order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail

          # Resume partial release: already-published crates skipped.
          # Full dep-order (for reference):
          #   solti-model, solti-runner, solti-observe, solti-exec,
          #   solti-core, solti-prometheus, solti-api, solti-discover
          CRATES=(
            solti-api
            solti-discover
          )

          for crate in "${CRATES[@]}"; do
            echo "::group::Publishing $crate"
            cargo publish -p "$crate" --all-features
            echo "::endgroup::"
            sleep 30
          done

  publish-release:
    needs: publish-crates
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s")
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body: |
            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Crates published
            - https://crates.io/crates/solti-model
            - https://crates.io/crates/solti-runner
            - https://crates.io/crates/solti-observe
            - https://crates.io/crates/solti-exec
            - https://crates.io/crates/solti-core
            - https://crates.io/crates/solti-prometheus
            - https://crates.io/crates/solti-api
            - https://crates.io/crates/solti-discover

            ### Docs
            - https://docs.rs/solti-model
            - https://docs.rs/solti-api
