name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {
  contents: read,
  actions: write
}

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  verify:
    name: Verify tag and versions
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure main is fetched
        run: git fetch origin main --depth=1

      - name: Verify tag commit is on main
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          TAG_COMMIT=$(git rev-list -n 1 "$REF")
          git rev-parse --verify origin/main >/dev/null

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag commit is not an ancestor of origin/main"
            exit 1
          fi

      - name: Verify workspace.package.version matches tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_VERSION="${REF_NAME#v}"
          FILE_VERSION=$(awk '
            /^\[workspace.package\]/ { in_section=1; next }
            /^\[/ { in_section=0 }
            in_section && /^\s*version\s*=/ {
              match($0, /"([^"]+)"/, m); print m[1]; exit
            }
          ' Cargo.toml)

          if [ -z "$FILE_VERSION" ] || [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::workspace.package.version ($FILE_VERSION) must equal tag ($TAG_VERSION, from '$REF_NAME')"
            exit 1
          fi

      - name: Verify internal path-deps versions
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_VERSION="${REF_NAME#v}"
          
          bad=0
          while IFS= read -r line; do
            file=${line%%:*}
            rest=${line#*:}
            ver=$(printf '%s' "$rest" | grep -oE 'version[[:space:]]*=[[:space:]]*"[^"]*"' | sed -E 's/.*"([^"]*)".*/\1/')
            if [ -z "$ver" ] || [ "$ver" != "$TAG_VERSION" ]; then
              echo "::error file=$file::internal path-dep version '$ver' != workspace '$TAG_VERSION' — line: ${rest}"
              bad=$((bad + 1))
            fi
          done < <(grep -n -E '^[[:space:]]*solti-[a-z-]+[[:space:]]*=[[:space:]]*\{.*path[[:space:]]*=' crates/*/Cargo.toml)

          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad internal path-dep(s) misaligned with workspace version"
            exit 1
          fi

  crates:
    needs: verify
    uses: ./.github/workflows/.crates.yml

  publish:
    name: Publish crates
    needs: crates
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: soltiHQ/actions/cargo-publish@main
        with:
          token: ${{ secrets.CRATES_IO_TOKEN }}
          crates: ${{ needs.crates.outputs.list }}

  gh-release:
    name: GitHub release
    needs: publish
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s")
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body: |
            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Crates published
            - https://crates.io/crates/solti-model
            - https://crates.io/crates/solti-runner
            - https://crates.io/crates/solti-observe
            - https://crates.io/crates/solti-exec
            - https://crates.io/crates/solti-core
            - https://crates.io/crates/solti-prometheus
            - https://crates.io/crates/solti-api
            - https://crates.io/crates/solti-discover

            ### Docs
            - https://docs.rs/solti-model
            - https://docs.rs/solti-api
