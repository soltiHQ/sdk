name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {
  contents: read,
  actions: write
}

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  verify:
    name: Verify tag and versions
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure main is fetched
        run: git fetch origin main --depth=1

      - name: Verify tag commit is on main
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          TAG_COMMIT=$(git rev-list -n 1 "$REF")
          git rev-parse --verify origin/main >/dev/null

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag commit is not an ancestor of origin/main"
            exit 1
          fi

      - name: Verify workspace.package.version matches tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_VERSION="${REF_NAME#v}"
          FILE_VERSION=$(awk '
            /^\[workspace.package\]/ { in_section=1; next }
            /^\[/ { in_section=0 }
            in_section && /^\s*version\s*=/ {
              match($0, /"([^"]+)"/, m); print m[1]; exit
            }
          ' Cargo.toml)

          if [ -z "$FILE_VERSION" ] || [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::workspace.package.version ($FILE_VERSION) must equal tag ($TAG_VERSION, from '$REF_NAME')"
            exit 1
          fi

      - name: Verify internal path-deps versions
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_VERSION="${REF_NAME#v}"
          
          bad=0
          while IFS= read -r line; do
            file=${line%%:*}
            rest=${line#*:}
            ver=$(printf '%s' "$rest" | grep -oE 'version[[:space:]]*=[[:space:]]*"[^"]*"' | sed -E 's/.*"([^"]*)".*/\1/')
            if [ -z "$ver" ] || [ "$ver" != "$TAG_VERSION" ]; then
              echo "::error file=$file::internal path-dep version '$ver' != workspace '$TAG_VERSION' — line: ${rest}"
              bad=$((bad + 1))
            fi
          done < <(grep -n -E '^[[:space:]]*solti-[a-z-]+[[:space:]]*=[[:space:]]*\{.*path[[:space:]]*=' crates/*/Cargo.toml)

          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad internal path-dep(s) misaligned with workspace version"
            exit 1
          fi

  crates:
    needs: verify
    uses: ./.github/workflows/.crates.yml

  publish:
    name: Publish crates
    needs: crates
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor proto
        uses: soltiHQ/actions/taskfile@main
        with:
          command: proto/vendor
      - uses: soltiHQ/actions/cargo-publish@main
        with:
          token: ${{ secrets.CRATES_IO_TOKEN }}
          crates: ${{ needs.crates.outputs.list }}

  gh-release:
    name: GitHub release
    needs: [crates, publish]
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: write
    steps:
      - name: Build crate/docs links
        id: body
        shell: bash
        env:
          CRATES: ${{ needs.crates.outputs.list }}
        run: |
          set -euo pipefail
          {
            echo "body<<EOF"
            echo "### Crates published"
            for c in $CRATES; do
              echo "- https://crates.io/crates/$c"
            done
            echo
            echo "### Docs"
            for c in $CRATES; do
              echo "- https://docs.rs/$c"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: ${{ steps.body.outputs.body }}
