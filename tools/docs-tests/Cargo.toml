[package]
name = "solti-docs-tests"
description = "Compilation harness for runnable Solti SDK documentation examples."
publish = false
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobenches = false
autobins = false
autoexamples = false
autotests = false

[lib]
doc = false
test = false
bench = false

[features]
default = []
guides = [
    "dep:async-trait",
    "dep:serde",
    "dep:serde_json",
    "dep:solti",
    "dep:solti-api",
    "dep:solti-chain",
    "dep:solti-core",
    "dep:solti-discover",
    "dep:solti-exec",
    "dep:solti-model",
    "dep:solti-observe",
    "dep:solti-prometheus",
    "dep:solti-runner",
    "dep:solti-tls",
    "dep:taskvisor",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tracing",
]

[dependencies]
async-trait = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
solti = { workspace = true, optional = true, features = ["full"] }
solti-api = { workspace = true, optional = true }
solti-chain = { workspace = true, optional = true }
solti-core = { workspace = true, optional = true }
solti-discover = { workspace = true, optional = true }
solti-exec = { workspace = true, optional = true }
solti-model = { workspace = true, optional = true }
solti-observe = { workspace = true, optional = true }
solti-prometheus = { workspace = true, optional = true }
solti-runner = { workspace = true, optional = true }
solti-tls = { workspace = true, optional = true }
taskvisor = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
