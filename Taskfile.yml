version: '3'

includes:
  rust:
    taskfile: https://raw.githubusercontent.com/soltiHQ/actions/be0b13df45cb3d522f4ed22dbdf3125a2032f252/taskfiles/rust/Taskfile.yml # v1
    vars:
      image_patch: "-1"
  helpers:
    taskfile: https://raw.githubusercontent.com/soltiHQ/actions/be0b13df45cb3d522f4ed22dbdf3125a2032f252/taskfiles/helpers/Taskfile.yml # v1

vars:
  publish_crates:
    sh: grep -vE '^\s*(#|$)' .github/crates.txt

tasks:
  proto/vendor:
    desc: Re-vendor .proto from soltiHQ/proto.
    silent: true
    cmds:
      - task: helpers:proto/vendor
        vars:
          proto_ref: "v0.0.4"
          MAPPINGS: |
            solti/task crates/solti-api/proto/solti/task
            solti/discover crates/solti-discover/proto/solti/discover

  ci/fmt:
    desc: Run 'cargo fmt --check'.
    cmds:
      - task: rust:fmt

  ci/check:
    desc: Run 'cargo check'.
    deps: [proto/vendor]
    cmds:
      - task: rust:check

  ci/clippy:
    desc: "Run 'cargo clippy' for one feature set. FEATURE = none|all|<feature-name> (default: all)."
    deps: [proto/vendor]
    vars:
      FEATURE: '{{.FEATURE | default "all"}}'
      FEATURE_FLAGS:
        sh: |
          case "{{.FEATURE}}" in
            none) echo '--no-default-features' ;;
            all)  echo '--all-features' ;;
            *)    echo "--no-default-features --features {{.FEATURE}}" ;;
          esac
    cmds:
      - task: rust:clippy
        vars: { CLIPPY_ARGS: '--workspace --all-targets {{.FEATURE_FLAGS}} -- -D warnings' }

  ci/test:
    desc: Run 'cargo test' (all targets, all features).
    deps: [proto/vendor]
    cmds:
      - task: rust:test

  ci/test-unit:
    desc: Run unit tests ('cargo test --lib') and doctests ('cargo test --doc').
    deps: [proto/vendor]
    cmds:
      - task: rust:test
        vars: { TEST_ARGS: '--workspace --lib --all-features' }
      - task: rust:test
        vars: { TEST_ARGS: '--workspace --doc --all-features' }

  ci/test-integration:
    desc: Run integration tests ('cargo test --test "*"').
    deps: [proto/vendor]
    cmds:
      - task: rust:test
        vars: { TEST_ARGS: '--workspace --test "*" --all-features' }

  ci/audit:
    desc: Run 'cargo audit'.
    cmds:
      - task: rust:audit

  ci/build:
    desc: Build a crate. Pass CRATE.
    deps: [proto/vendor]
    requires:
      vars: [ CRATE ]
    cmds:
      - task: rust:build
        vars:
          CRATE: '{{.CRATE}}'

  ci/publish-dry-run:
    desc: Simulate 'cargo publish' for publishable workspace crates.
    deps: [proto/vendor]
    cmds:
      - for:
          var: publish_crates
        task: rust:publish-dry-run
        vars:
          CRATE: '{{.ITEM}}'
          PUBLISH_ARGS: "--all-features --allow-dirty"

  ci/docs:
    desc: Run 'rustdoc' for the SDK workspace. Fails on broken doc links in any feature config.
    deps: [proto/vendor]
    cmds:
      - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
