version: '3'

includes:
  rust:
    taskfile: https://raw.githubusercontent.com/soltiHQ/actions/main/taskfiles/rust/Taskfile.yml
    vars:
      image_patch: "-1"
  helpers:
    taskfile: https://raw.githubusercontent.com/soltiHQ/actions/main/taskfiles/helpers/Taskfile.yml

tasks:
  proto/vendor:
    desc: Re-vendor .proto from soltiHQ/proto (pinned ref) into the crates.
    silent: true
    cmds:
      - task: helpers:proto/vendor
        vars:
          proto_ref: "v0.0.1"
          MAPPINGS: |
            solti/task crates/solti-api/proto/solti/task
            solti/discover crates/solti-discover/proto/solti/discover

  ci/fmt:
    desc: Run 'cargo fmt --check'.
    cmds:
      - task: rust:fmt

  ci/check:
    desc: Run 'cargo check'.
    deps: [proto/vendor]
    cmds:
      - task: rust:check

  ci/clippy:
    desc: Run 'cargo clippy'.
    deps: [proto/vendor]
    cmds:
      - task: rust:clippy

  ci/test:
    desc: Run 'cargo test'.
    deps: [proto/vendor]
    cmds:
      - task: rust:test

  ci/audit:
    desc: Run 'cargo audit'.
    cmds:
      - task: rust:audit

  ci/build:
    desc: Build a crate. Pass CRATE.
    deps: [proto/vendor]
    requires:
      vars: [ CRATE ]
    cmds:
      - task: rust:build
        vars:
          CRATE: '{{.CRATE}}'

  ci/publish-dry-run:
    desc: Simulate 'cargo publish' for a crate. Pass CRATE.
    deps: [proto/vendor]
    requires:
      vars: [ CRATE ]
    cmds:
      - task: rust:publish-dry-run
        vars:
          CRATE: '{{.CRATE}}'

  ci/docs:
    desc: Run 'rustdoc' for a crate. Pass CRATE.
    deps: [proto/vendor]
    requires:
      vars: [ CRATE ]
    cmds:
      - task: rust:docs
        vars:
          CRATE: '{{.CRATE}}'
