[package]
name = "solti-runner"

description   = "Runner plugin trait, routing, and execution metrics for the Solti task SDK."
keywords      = ["runner", "plugin", "tasks", "async", "executor"]
categories    = ["asynchronous", "concurrency"]
documentation = "https://docs.rs/solti-runner"
readme        = "README.md"

rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
version.workspace      = true
edition.workspace      = true
license.workspace      = true

[features]
default = []

[dependencies]
solti-model = { workspace = true }

async-trait = { workspace = true }
bytes       = { workspace = true }
serde       = { workspace = true }
taskvisor   = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true, features = ["sync"] }
tokio-util  = { workspace = true }

[dev-dependencies]
proptest   = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
