[package]
name = "solti-tls"

description   = "Shared TLS and mTLS configuration for Solti network crates, based on rustls."
keywords      = ["tls", "rustls", "mtls", "certificate", "pem"]
categories    = ["network-programming", "cryptography"]
documentation = "https://docs.rs/solti-tls"
readme        = "README.md"

rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
version.workspace      = true
edition.workspace      = true
license.workspace      = true

[features]
default = []

[dependencies]
rustls    = { workspace = true }
thiserror = { workspace = true }
zeroize   = { workspace = true }

[dev-dependencies]
rcgen        = { workspace = true }
tempfile     = { workspace = true }
tokio        = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
