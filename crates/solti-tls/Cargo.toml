[package]
name = "solti-tls"
description = "Shared TLS and mTLS configuration builders for Solti network crates, based on rustls."
documentation = "https://docs.rs/solti-tls"

rust-version.workspace = true
repository.workspace = true
categories = ["network-programming", "cryptography"]
homepage.workspace = true
keywords = ["tls", "rustls", "mtls", "certificate", "pem"]
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
rustls         = { workspace = true }
rustls-pemfile = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
rcgen        = { workspace = true }
tempfile     = { workspace = true }
tokio        = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
