syntax = "proto3";

package solti.task.v1;

import "solti/task/v1/types.proto";

// Task management API exposed by the agent.
// The control-plane is the client; the agent runs the tasks.
service TaskService {
  // Create a named Task resource. Fails when the name already exists.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);

  // Declaratively create or update one named Task resource.
  rpc ApplyTask(ApplyTaskRequest) returns (ApplyTaskResponse);

  // Get one Task resource by metadata.name.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);

  // List tasks with optional filters and pagination.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // List the attempt history of one task (oldest first).
  rpc ListTaskRuns(ListTaskRunsRequest) returns (ListTaskRunsResponse);

  // Stop a task and purge its history.
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);

  // Live-tail stdout/stderr events for a task, merged across attempts.
  rpc StreamTaskLogs(StreamTaskLogsRequest) returns (stream StreamTaskLogsResponse);
}

// CreateTask desired-state input.
message CreateTaskRequest {
  TaskManifest manifest = 1;
}

// CreateTask output.
message CreateTaskResponse {
  Task task = 1;
}

// ApplyTask desired-state input. The resource is addressed by manifest.metadata.name.
message ApplyTaskRequest {
  TaskManifest manifest = 1;
}

// ApplyTask output.
message ApplyTaskResponse {
  Task task = 1;
}

// GetTask input.
message GetTaskRequest {
  string name = 1;
}

// GetTask output.
message GetTaskResponse {
  Task task = 1; // always present; an unknown name is returned as gRPC NotFound
}

// ListTasks input.
// Filters are ANDed; omitted filters match all.
message ListTasksRequest {
  optional string     slot   = 1; // filter by slot
  optional TaskPhase phase  = 2; // filter by phase
  uint32              limit  = 3; // page size; 0 = default 100, max 1000
  uint32              offset = 4; // page offset; default 0
}

// ListTasks output.
message ListTasksResponse {
  repeated Task tasks     = 1; // one page of tasks
  uint32            total = 2; // total tasks matching the filters
}

// ListTaskRuns input.
message ListTaskRunsRequest {
  string name = 1;
}

// ListTaskRuns output.
message ListTaskRunsResponse {
  repeated TaskRunInfo runs = 1; // attempts, oldest first
}

// DeleteTask input.
message DeleteTaskRequest {
  string name = 1;
}

// DeleteTask output. Empty on success.
message DeleteTaskResponse {}

// StreamTaskLogs input.
message StreamTaskLogsRequest {
  string name = 1;
}

// Source stream of a captured output line.
enum OutputStreamKind {
  OUTPUT_STREAM_KIND_UNSPECIFIED = 0;
  OUTPUT_STREAM_KIND_STDOUT      = 1;
  OUTPUT_STREAM_KIND_STDERR      = 2;
}

// One captured line of process output.
message OutputChunk {
  uint64           generation = 1; // desired-state generation that produced the line
  uint32           attempt    = 2; // attempt within generation
  OutputStreamKind stream     = 3; // stdout or stderr
  uint64           seq        = 4; // per-stream sequence; resets each attempt
  int64            ts         = 5; // time the agent read the line (ms)
  bytes            line       = 6; // raw line content
}

// A new attempt started.
message RunStarted {
  uint64 generation = 1;
  uint32 attempt    = 2;
  int64  started_at = 3;
}

// The current attempt ended. Stop accumulating its chunks.
message RunFinished {
  uint64         generation  = 1;
  uint32         attempt     = 2;
  optional int32 exit_code   = 3;
  int64          finished_at = 4;
}

// The subscriber fell behind and the server dropped events.
message Lagged {
  uint64 skipped = 1; // number of events missed
}

// One StreamTaskLogs event: exactly one field is set.
message StreamTaskLogsResponse {
  oneof kind {
    OutputChunk chunk        = 1; // output line
    RunStarted  run_started  = 2; // attempt started
    RunFinished run_finished = 3; // attempt ended
    Lagged      lagged       = 4; // events were dropped
  }
}
