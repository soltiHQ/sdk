syntax = "proto3";

package solti.task.v1;

// Shared value types for the task management API.
// Timestamps are Unix time in milliseconds unless stated otherwise.

// Phase of a task's current attempt.
enum TaskPhase {
  TASK_PHASE_UNSPECIFIED = 0;
  TASK_PHASE_PENDING     = 1; // queued, not started yet
  TASK_PHASE_RUNNING     = 2; // currently executing
  TASK_PHASE_SUCCEEDED   = 3; // finished successfully
  TASK_PHASE_FAILED      = 4; // attempt failed; may restart per policy
  TASK_PHASE_TIMEOUT     = 5; // killed after exceeding timeout_ms
  TASK_PHASE_CANCELED    = 6; // stopped on request; not a failure
  TASK_PHASE_EXHAUSTED   = 7; // restart budget spent; no more retries
}

// When to restart a task after an attempt ends.
enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;
  RESTART_POLICY_NEVER       = 1; // never restart
  RESTART_POLICY_ON_FAILURE  = 2; // restart only on failure or non-zero exit
  RESTART_POLICY_ALWAYS      = 3; // always restart; waits restart_interval_ms
}

// Randomness added to each backoff delay to avoid retry storms.
// "base" is the delay computed by BackoffPolicy before jitter.
enum JitterPolicy {
  JITTER_POLICY_UNSPECIFIED  = 0;
  JITTER_POLICY_NONE         = 1; // exact base, no randomness
  JITTER_POLICY_FULL         = 2; // uniform in [0, base]
  JITTER_POLICY_EQUAL        = 3; // centered near base/2
  JITTER_POLICY_DECORRELATED = 4; // min(max, rand(base * 3))
}

// What to do when the target slot is already busy.
enum AdmissionPolicy {
  ADMISSION_POLICY_UNSPECIFIED     = 0;
  ADMISSION_POLICY_DROP_IF_RUNNING = 1; // ignore the new task, report success
  ADMISSION_POLICY_REPLACE         = 2; // cancel the running task, start the new one
  ADMISSION_POLICY_QUEUE           = 3; // wait, run when the slot frees up
}

// Built-in script interpreter. Use CustomRuntime for anything else.
enum ScriptRuntime {
  SCRIPT_RUNTIME_UNSPECIFIED = 0;
  SCRIPT_RUNTIME_BASH        = 1; // bash
  SCRIPT_RUNTIME_PYTHON      = 2; // python / python3
  SCRIPT_RUNTIME_NODE        = 3; // node
}

// One environment variable.
message KeyValue {
  string key   = 1;
  string value = 2;
}

// Run a command directly (resolved via PATH).
message CommandMode {
  string          command = 1; // executable name or path
  repeated string args    = 2;
}

// User-defined interpreter for a script.
message CustomRuntime {
  string command = 1; // interpreter path, e.g. "ruby"
  string flag    = 2; // inline-script flag, e.g. "-e"
}

// Typed script runtime selection.
message Runtime {
  oneof runtime {
    ScriptRuntime well_known = 1; // built-in interpreter
    CustomRuntime custom     = 2; // user-defined interpreter
  }
}

// Run a script through a known or custom interpreter.
message ScriptMode {
  Runtime         runtime = 1;
  string          body    = 2; // script content, base64-encoded
  repeated string args    = 3;
}

// Typed subprocess execution strategy.
message SubprocessMode {
  oneof mode {
    CommandMode command = 1; // direct command
    ScriptMode  script  = 2; // script via interpreter
  }
}

// Run an external OS process.
message SubprocessTask {
  SubprocessMode   mode             = 1;
  repeated KeyValue env              = 2;
  optional string   cwd              = 3; // working directory; agent default if unset
  bool              fail_on_non_zero = 4; // treat non-zero exit as failure
}

// Run a WebAssembly module.
// (Reserved; agent support may be incomplete.)
message WasmTask {
  string            module = 1; // path to the .wasm file
  repeated string   args   = 2;
  repeated KeyValue env    = 3;
}

// Run an OCI container.
// (Reserved; agent support may be incomplete.)
message ContainerCommand {
  repeated string items = 1; // explicit entrypoint override; may be empty
}

message ContainerTask {
  string                   image   = 1; // image reference
  optional ContainerCommand command = 2; // absent = image default, present = explicit override
  repeated string          args    = 3;
  repeated KeyValue        env     = 4;
}

// Workload implemented by an application-provided runner.
// Mirrors Kubernetes RawExtension: `raw` is one UTF-8 JSON value.
message RawExtension {
  bytes raw = 1;
}

message ExtensionTask {
  RawExtension spec = 1; // arbitrary JSON object interpreted by the runner
}

// Versioned desired workload handled by a registered runner.
// Embedded workloads intentionally have no public representation.
message TaskWorkload {
  string api_version = 1; // workload API group/version; required
  string kind        = 2; // workload kind; required; built-ins must match their typed spec
  oneof spec {
    SubprocessTask subprocess = 3;
    WasmTask       wasm       = 4;
    ContainerTask  container  = 5;
    ExtensionTask  extension  = 6;
  }
}

// Exponential backoff between restart attempts.
message BackoffPolicy {
  JitterPolicy jitter   = 1; // jitter applied to each delay
  uint64       first_ms = 2; // initial delay (ms); must be > 0
  uint64       max_ms   = 3; // delay cap (ms); must be >= first_ms
  double       factor   = 4; // growth multiplier; must be finite and >= 1.0
}

// Comparison operator for one selector requirement.
enum SelectorOperator {
  SELECTOR_OPERATOR_UNSPECIFIED    = 0;
  SELECTOR_OPERATOR_IN             = 1; // label value must be one of values
  SELECTOR_OPERATOR_NOT_IN         = 2; // label value must not be one of values
  SELECTOR_OPERATOR_EXISTS         = 3; // label key must exist; values must be empty
  SELECTOR_OPERATOR_DOES_NOT_EXIST = 4; // label key must not exist; values must be empty
}

// One set-based selector requirement.
message SelectorRequirement {
  string           key      = 1; // label key; non-empty
  SelectorOperator operator = 2; // comparison operator
  repeated string  values   = 3; // required for IN / NOT_IN; empty otherwise
}

// Label selector for runner routing.
message RunnerSelector {
  map<string, string>          match_labels      = 1; // exact key=value pairs
  repeated SelectorRequirement match_expressions = 2; // set-based rules, ANDed with match_labels
}

// Desired state of a Task resource.
message TaskSpec {
  string              slot                = 1;  // execution lane; non-empty, max 64 chars
  TaskWorkload        workload            = 2;  // versioned executable desired state; required
  uint64              timeout_ms          = 3;  // per-attempt timeout (ms); must be > 0
  RestartPolicy       restart             = 4;  // restart policy
  optional uint64     restart_interval_ms = 5;  // delay between runs; ALWAYS only
  BackoffPolicy       backoff             = 6;  // retry backoff; required
  AdmissionPolicy     admission           = 7;  // slot-conflict policy
  reserved 8;                                  // labels moved to ObjectMeta
  optional uint32     max_retries         = 9;  // failure-retry budget; omit = unlimited; 0 is invalid
  RunnerSelector      runner_selector     = 10; // label-based runner routing; omit = any runner
}

// User-owned metadata accepted on create and apply.
message TaskManifestMeta {
  string              name        = 1; // stable resource address
  map<string, string> labels      = 2;
  map<string, string> annotations = 3;
}

// Desired Task resource. Server-owned identity and status are deliberately absent.
message TaskManifest {
  string           api_version = 1; // solti.io/v1
  string           kind        = 2; // Task
  TaskManifestMeta metadata    = 3;
  TaskSpec         spec        = 4;
}

// Identity, versioning and timestamps of a stored object.
message ObjectMeta {
  string              name               = 1; // stable resource address
  string              uid                = 2; // server-assigned resource-incarnation identity
  string              resource_version   = 3; // opaque store revision
  uint64              generation         = 4; // desired-state generation
  int64               creation_timestamp = 5; // creation time (ms)
  map<string, string> labels              = 6;
  map<string, string> annotations         = 7;
}

// Kubernetes-compatible three-valued condition status.
enum ConditionStatus {
  CONDITION_STATUS_UNSPECIFIED = 0;
  CONDITION_STATUS_UNKNOWN     = 1;
  CONDITION_STATUS_TRUE        = 2;
  CONDITION_STATUS_FALSE       = 3;
}

// One observed condition for a Task resource.
message TaskCondition {
  string          type                 = 1;
  ConditionStatus status               = 2;
  uint64          observed_generation  = 3;
  int64           last_transition_time = 4; // Unix time (ms)
  string          reason               = 5;
  string          message              = 6;
}

// Observed controller and execution status of a Task.
message TaskStatus {
  uint64                 observed_generation = 1; // latest desired generation processed by the controller
  TaskPhase              phase                = 2; // current execution phase
  uint32                 attempt              = 3; // execution attempt within observed_generation
  optional string        error                = 4; // execution diagnostic, if any
  optional int32         exit_code            = 5; // process exit code, if the process exited
  repeated TaskCondition conditions           = 6; // controller conditions
}

// Full Kubernetes-shaped Task resource.
message Task {
  string     api_version = 1; // solti.io/v1
  string     kind        = 2; // Task
  ObjectMeta metadata    = 3;
  TaskSpec   spec        = 4;
  TaskStatus status      = 5;
}

// History record for one finished or running attempt.
message TaskRunInfo {
  uint64          generation           = 1; // desired-state generation executed by this run
  uint32          attempt              = 2; // attempt number within generation
  TaskPhase       phase                = 3; // phase of this attempt
  int64           started_at           = 4; // start time (ms)
  optional int64  finished_at          = 5; // end time (ms); absent while running
  optional string error                = 6; // error message, if any
  optional int32  exit_code            = 7; // process exit code, if the process exited
  string          workload_api_version = 8; // workload GVK apiVersion captured for this run
  string          workload_kind        = 9; // workload GVK kind captured for this run
}
