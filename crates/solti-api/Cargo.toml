[package]
name = "solti-api"

description   = "HTTP/JSON and gRPC API layer for the Solti task supervisor SDK."
keywords      = ["grpc", "http", "api", "tonic", "tasks"]
categories    = ["network-programming", "web-programming"]
documentation = "https://docs.rs/solti-api"
readme        = "README.md"

rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
version.workspace      = true
edition.workspace      = true
license.workspace      = true

include = [
    "proto/**/*.proto",
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "build.rs",
]

[features]
default      = []
core-adapter = ["dep:solti-core"]
grpc         = [
    "dep:base64",
    "dep:prost",
    "dep:protoc-bin-vendored",
    "dep:serde",
    "dep:serde_json",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:tracing",
]
grpc-tls     = ["grpc", "dep:solti-tls", "tonic/tls-ring"]
http         = [
    "dep:axum",
    "dep:base64",
    "dep:form_urlencoded",
    "dep:serde",
    "dep:serde_json",
    "dep:tower-http",
    "dep:tracing",
]

[dependencies]
solti-core  = { workspace = true, optional = true }
solti-model = { workspace = true }
solti-tls   = { workspace = true, optional = true }

async-trait     = { workspace = true }
tokio-stream    = { workspace = true }
axum            = { workspace = true, optional = true }
base64          = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
prost           = { workspace = true, optional = true }
serde           = { workspace = true, features = ["derive"], optional = true }
serde_json      = { workspace = true, optional = true }
thiserror       = { workspace = true }
tonic           = { workspace = true, optional = true }
tonic-prost     = { workspace = true, optional = true }
tower-http      = { workspace = true, features = ["limit"], optional = true }
tracing         = { workspace = true, optional = true }

[dev-dependencies]
base64         = { workspace = true }
bytes          = { workspace = true }
http-body-util = { workspace = true }
rcgen          = { workspace = true }
serde_json     = { workspace = true }
solti-runner    = { workspace = true }
taskvisor      = { workspace = true }
tokio          = { workspace = true, features = ["macros", "rt"] }
tower          = { workspace = true, features = ["util"] }

[build-dependencies]
protoc-bin-vendored = { workspace = true, optional = true }
tonic-prost-build   = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]