[package]
name = "solti-api"
description = "HTTP/JSON and gRPC API layer for the Solti task supervisor SDK."

rust-version.workspace = true
repository.workspace = true
categories = ["network-programming", "web-programming"]
homepage.workspace = true
keywords = ["grpc", "http", "api", "tonic", "tasks"]
version.workspace = true
edition.workspace = true
license.workspace = true

include = [
    "proto/**/*.proto",
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "api_v1.md",
    "build.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default      = []
core-adapter = ["dep:solti-core"]
grpc         = ["dep:tonic", "dep:tonic-prost", "dep:prost"]
grpc-tls     = ["grpc", "dep:solti-tls", "tonic/tls-ring"]
http         = ["dep:axum", "dep:pbjson", "dep:prost", "dep:serde_json", "dep:tower-http"]

[dependencies]
async-trait  = { workspace = true }
tokio-stream = { workspace = true }
axum         = { workspace = true, optional = true }
pbjson       = { workspace = true, optional = true }
prost        = { workspace = true, optional = true }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true, optional = true }
thiserror    = { workspace = true }
tonic        = { workspace = true, optional = true }
tonic-prost  = { workspace = true, optional = true }
tower-http   = { workspace = true, features = ["limit"], optional = true }
tracing      = { workspace = true }

solti-core  = { workspace = true, optional = true }
solti-model = { workspace = true }
solti-tls  = { workspace = true, optional = true }

[dev-dependencies]
base64         = { workspace = true }
bytes          = { workspace = true }
http-body-util = { workspace = true }
rcgen          = { workspace = true }
solti-runner    = { workspace = true }
taskvisor      = { workspace = true }
tokio          = { workspace = true, features = ["macros", "rt"] }
tower          = { workspace = true, features = ["util"] }

[build-dependencies]
pbjson-build        = { workspace = true }
protoc-bin-vendored = { workspace = true }
tonic-prost-build   = { workspace = true }
