[package]
name = "solti-api"

description   = "HTTP/JSON and gRPC API layer for the Solti task supervisor SDK."
keywords      = ["grpc", "http", "api", "tonic", "tasks"]
categories    = ["network-programming", "web-programming"]
documentation = "https://docs.rs/solti-api"
readme        = "README.md"

rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
version.workspace      = true
edition.workspace      = true
license.workspace      = true

include = [
    "CONTRACT.md",
    "examples/**/*.rs",
    "proto/**/*.proto",
    "src/**/*.rs",
    "README.md",
]

[features]
default      = []
core-adapter = ["dep:solti-core"]
grpc         = [
    "dep:base64",
    "dep:prost",
    "dep:serde",
    "dep:serde_json",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tracing",
]
grpc-tls     = ["grpc", "dep:solti-tls", "tonic/tls-ring"]
http         = [
    "dep:aide",
    "dep:axum",
    "dep:base64",
    "dep:form_urlencoded",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:tower-http",
    "dep:tracing",
    "solti-model/schema",
]

[dependencies]
solti-core  = { workspace = true, optional = true }
solti-model = { workspace = true }
solti-tls   = { workspace = true, optional = true }

async-trait     = { workspace = true }
tokio-stream    = { workspace = true }
aide            = { workspace = true, features = ["axum", "axum-json", "axum-query"], optional = true }
axum            = { workspace = true, optional = true }
base64          = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
prost           = { workspace = true, optional = true }
schemars        = { workspace = true, optional = true }
serde           = { workspace = true, features = ["derive"], optional = true }
serde_json      = { workspace = true, optional = true }
thiserror       = { workspace = true }
tonic           = { workspace = true, optional = true }
tonic-prost     = { workspace = true, optional = true }
tower-http      = { workspace = true, features = ["limit"], optional = true }
tracing         = { workspace = true, optional = true }

[dev-dependencies]
base64              = { workspace = true }
bytes               = { workspace = true }
http-body-util      = { workspace = true }
protoc-bin-vendored = { workspace = true }
rcgen               = { workspace = true }
serde_json          = { workspace = true }
solti-chain         = { workspace = true }
solti-model         = { workspace = true, features = ["schema"] }
solti-runner        = { workspace = true }
taskvisor           = { workspace = true }
tempfile            = { workspace = true }
tokio               = { workspace = true, features = ["macros", "net", "rt", "sync"] }
tokio-stream        = { workspace = true, features = ["net"] }
tonic-prost-build   = { workspace = true }
tower               = { workspace = true, features = ["util"] }

[[example]]
name              = "core_adapter"
required-features = ["core-adapter"]

[[example]]
name              = "grpc_contract"
required-features = ["grpc"]

[[example]]
name              = "http_contract"
required-features = ["http"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
