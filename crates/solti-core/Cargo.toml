[package]
name = "solti-core"

description   = "Supervisor layer of the Solti SDK. It bridges the task model to the taskvisor runtime."
keywords      = ["supervisor", "tasks", "async", "runtime", "tokio"]
categories    = ["asynchronous", "concurrency"]
documentation = "https://docs.rs/solti-core"
readme        = "README.md"

rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
version.workspace      = true
edition.workspace      = true
license.workspace      = true

[features]
default   = []
test-util = ["taskvisor/test-util"]

[dependencies]
bytes        = { workspace = true }
solti-model  = { workspace = true }
solti-runner = { workspace = true }

parking_lot  = { workspace = true }
serde_json   = { workspace = true }
taskvisor    = { workspace = true, features = ["controller"] }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tokio        = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util   = { workspace = true }

[dev-dependencies]
solti-chain = { workspace = true, default-features = false }
taskvisor = { workspace = true, features = ["test-util"] }

[[bench]]
name              = "state_collections"
harness           = false
required-features = ["test-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
