[package]
name = "solti"

description          = "Thin feature and namespace façade for the modular Solti SDK."
documentation        = "https://docs.rs/solti"
readme               = "README.md"

keywords.workspace     = true
categories.workspace   = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
version.workspace      = true
edition.workspace      = true
license.workspace      = true

[features]
default = []

model = ["dep:solti-model", "solti-model/schema"]
tls   = ["dep:solti-tls"]

taskvisor                    = ["dep:taskvisor"]
taskvisor-controller         = ["taskvisor", "taskvisor/controller"]
taskvisor-logging            = ["taskvisor", "taskvisor/logging"]
taskvisor-tokio-util-interop = ["taskvisor", "taskvisor/tokio-util-interop"]
taskvisor-tracing            = ["taskvisor", "taskvisor/tracing"]

runner = ["dep:solti-runner", "model", "taskvisor"]
core   = ["dep:solti-core", "model", "runner", "taskvisor-controller"]

exec              = ["dep:solti-exec"]
exec-host-process = ["exec", "solti-exec/host-process"]
exec-seccomp      = ["exec-host-process", "solti-exec/seccomp"]
exec-subprocess   = [
    "exec-host-process",
    "model",
    "runner",
    "taskvisor",
    "solti-exec/subprocess",
]

api              = ["dep:solti-api", "model"]
api-core-adapter = ["api", "core", "solti-api/core-adapter"]
api-grpc         = ["api", "solti-api/grpc"]
api-grpc-tls     = ["api-grpc", "tls", "solti-api/grpc-tls"]
api-http         = ["api", "solti-api/http"]

discover      = ["dep:solti-discover"]
discover-grpc = ["discover", "model", "taskvisor", "solti-discover/grpc"]
discover-http = ["discover", "model", "taskvisor", "solti-discover/http"]
discover-tls  = ["discover", "tls", "solti-discover/tls"]

observe               = ["dep:solti-observe"]
observe-journald      = ["observe", "solti-observe/journald"]
observe-log-compat    = ["observe", "solti-observe/log-compat"]
observe-timezone-sync = [
    "observe",
    "model",
    "taskvisor",
    "solti-observe/timezone-sync",
]

prometheus-api                  = ["prometheus-base", "api", "solti-prometheus/api"]
prometheus-base                 = ["dep:solti-prometheus"]
prometheus-discover             = ["prometheus-base", "discover", "solti-prometheus/discover"]
prometheus-process              = ["prometheus-base", "solti-prometheus/process"]
prometheus-runner               = ["prometheus-base", "runner", "solti-prometheus/runner"]
prometheus-server               = [
    "prometheus-base",
    "model",
    "taskvisor",
    "solti-prometheus/server",
]
prometheus-state                = ["prometheus-base", "core", "model", "solti-prometheus/state"]
prometheus-taskvisor            = [
    "prometheus-base",
    "taskvisor",
    "solti-prometheus/taskvisor",
]
prometheus-taskvisor-controller = [
    "prometheus-taskvisor",
    "taskvisor-controller",
    "solti-prometheus/taskvisor-controller",
]

prometheus = [
    "prometheus-base",
    "prometheus-runner",
    "prometheus-taskvisor-controller",
]
prometheus-full = [
    "prometheus-api",
    "prometheus-discover",
    "prometheus-process",
    "prometheus-runner",
    "prometheus-server",
    "prometheus-state",
    "prometheus-taskvisor-controller",
]

full = [
    "api-core-adapter",
    "api-grpc-tls",
    "api-http",
    "discover-grpc",
    "discover-http",
    "discover-tls",
    "exec-seccomp",
    "exec-subprocess",
    "observe-journald",
    "observe-log-compat",
    "observe-timezone-sync",
    "prometheus-full",
    "taskvisor-logging",
    "taskvisor-tokio-util-interop",
    "taskvisor-tracing",
]

[dependencies]
solti-api        = { workspace = true, optional = true }
solti-core       = { workspace = true, optional = true }
solti-discover   = { workspace = true, optional = true }
solti-exec       = { workspace = true, optional = true }
solti-model      = { workspace = true, optional = true }
solti-observe    = { workspace = true, optional = true }
solti-prometheus = { workspace = true, optional = true }
solti-runner     = { workspace = true, optional = true }
solti-tls        = { workspace = true, optional = true }

taskvisor = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
