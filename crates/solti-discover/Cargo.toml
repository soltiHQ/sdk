[package]
name = "solti-discover"

description   = "Agent registration and heartbeat client for the Podium control plane."
keywords      = ["discovery", "heartbeat", "agent", "grpc", "http"]
categories    = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/solti-discover"
readme        = "README.md"

rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
version.workspace      = true
edition.workspace      = true
license.workspace      = true

include = [
    "examples/**/*.rs",
    "proto/**/*.proto",
    "src/**/*.rs",
    "CONTRACT.md",
    "README.md",
]

[features]
default = []
grpc = [
    "dep:prost",
    "dep:solti-model",
    "dep:taskvisor",
    "dep:tokio",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tracing",
]
http = [
    "dep:pbjson",
    "dep:prost",
    "dep:reqwest",
    "dep:rustls",
    "dep:serde",
    "dep:serde_json",
    "dep:solti-model",
    "dep:taskvisor",
    "dep:tokio",
    "dep:tracing",
]
tls  = ["dep:solti-tls", "tonic?/tls-native-roots", "tonic?/tls-ring"]

[dependencies]
solti-model = { workspace = true, optional = true }
solti-tls   = { workspace = true, optional = true }

pbjson      = { workspace = true, optional = true }
prost       = { workspace = true, optional = true }
reqwest     = { workspace = true, optional = true, features = [
    "http2",
    "json",
    "rustls-no-provider",
    "system-proxy",
] }
rustls      = { workspace = true, optional = true }
serde       = { workspace = true, optional = true }
serde_json  = { workspace = true, optional = true }
taskvisor   = { workspace = true, optional = true }
thiserror   = { workspace = true }
tokio       = { workspace = true, optional = true }
tonic       = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
tracing     = { workspace = true, optional = true }

[dev-dependencies]
pbjson-build        = { workspace = true }
protoc-bin-vendored = { workspace = true }
taskvisor           = { workspace = true, features = ["test-util"] }
tempfile            = { workspace = true }
tokio               = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
tonic-prost-build   = { workspace = true }

[[example]]
name              = "grpc_sync"
required-features = ["grpc"]

[[example]]
name              = "http_sync"
required-features = ["http"]

[[example]]
name              = "retryability"
required-features = ["grpc", "http"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
