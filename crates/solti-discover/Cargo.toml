[package]
name = "solti-discover"
description = "Solti SDK agent-registration and heartbeat client for the Podium control-plane."

rust-version.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

include = [
    "proto/**/*.proto",
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "build.rs",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost"]
http = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:prost", "dep:pbjson"]
tls  = ["dep:solti-tls", "tonic?/tls-ring", "reqwest?/rustls-no-provider", ]

[dependencies]
pbjson      = { workspace = true, optional = true }
prost       = { workspace = true, optional = true }
reqwest     = { workspace = true, features = ["json"], optional = true }
serde       = { workspace = true, optional = true }
serde_json  = { workspace = true, optional = true }
taskvisor   = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
tonic       = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
tracing     = { workspace = true }

solti-core  = { workspace = true }
solti-model = { workspace = true }
solti-tls   = { workspace = true, optional = true }

[build-dependencies]
pbjson-build        = { workspace = true }
protoc-bin-vendored = { workspace = true }
tonic-prost-build   = { workspace = true }
