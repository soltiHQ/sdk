[package]
name = "solti-exec"

description   = "Execution backends and host process controls for the Solti SDK."
keywords      = ["subprocess", "exec", "runner", "tasks", "process"]
categories    = ["os", "asynchronous"]
documentation = "https://docs.rs/solti-exec"
readme        = "README.md"

rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
version.workspace      = true
edition.workspace      = true
license.workspace      = true

exclude = ["ARCHITECTURE.md"]

[features]
default = []

container    = [
    "dep:async-trait",
    "dep:bytes",
    "dep:solti-model",
    "dep:solti-runner",
    "dep:taskvisor",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "tokio/macros",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
containerd   = [
    "container",
    "dep:containerd-client",
    "dep:getrandom",
    "dep:libc",
    "dep:oci-spec",
    "dep:prost",
    "dep:prost-types",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
    "dep:tonic-prost",
    "tokio/fs",
    "tokio/net",
]
host-process = ["dep:libc", "dep:tracing"]
seccomp      = ["host-process", "dep:seccompiler"]
subprocess   = [
    "host-process",
    "dep:bytes",
    "dep:solti-model",
    "dep:solti-runner",
    "dep:taskvisor",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tokio",
    "tokio/macros",
    "tokio/process",
    "tokio/signal",
    "tokio/time",
]

[dependencies]
solti-model  = { workspace = true, optional = true }
solti-runner = { workspace = true, optional = true }

async-trait       = { workspace = true, optional = true }
bytes             = { workspace = true, optional = true }
containerd-client = { workspace = true, optional = true }
getrandom         = { workspace = true, optional = true }
oci-spec          = { workspace = true, optional = true }
prost             = { workspace = true, optional = true }
prost-types       = { workspace = true, optional = true }
serde             = { workspace = true, optional = true }
serde_json        = { workspace = true, optional = true }
sha2              = { workspace = true, optional = true }
taskvisor         = { workspace = true, optional = true }
tempfile          = { workspace = true, optional = true }
thiserror         = { workspace = true, optional = true }
tokio             = { workspace = true, features = ["io-util"], optional = true }
tonic-prost       = { workspace = true, optional = true }
tracing           = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { workspace = true, optional = true }

[dev-dependencies]
base64    = { workspace = true }
taskvisor = { workspace = true, features = ["test-util"] }
tempfile  = { workspace = true }
tokio     = { workspace = true, features = ["rt", "macros", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
