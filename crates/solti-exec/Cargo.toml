[package]
name = "solti-exec"
description = "Execution backends and host process controls for the Solti SDK."

rust-version.workspace = true
repository.workspace = true
categories = ["os", "asynchronous"]
homepage.workspace = true
keywords = ["subprocess", "exec", "runner", "tasks", "process"]
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default      = []
host-process = ["dep:libc", "dep:tracing"]
seccomp      = ["host-process", "dep:seccompiler"]
subprocess   = [
    "host-process",
    "dep:bytes",
    "dep:solti-model",
    "dep:solti-runner",
    "dep:taskvisor",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tokio",
    "tokio/macros",
    "tokio/process",
    "tokio/time",
]

[dependencies]
bytes      = { workspace = true, optional = true }
thiserror  = { workspace = true, optional = true }
tracing    = { workspace = true, optional = true }
tokio      = { workspace = true, features = ["io-util"], optional = true }
taskvisor  = { workspace = true, optional = true }

solti-model  = { workspace = true, optional = true }
solti-runner = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# seccompiler is Linux-only; keep it off the dependency tree on other platforms.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { workspace = true, optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tempfile = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
taskvisor = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
