[package]
name = "solti-prometheus"
description = "Solti SDK Prometheus metrics."
documentation = "https://docs.rs/solti-prometheus"

rust-version.workspace = true
repository.workspace = true
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default  = []
api      = ["dep:solti-api"]
discover = ["dep:solti-discover"]
process  = ["prometheus/process"]
server   = ["dep:axum", "dep:tokio", "dep:tokio-util", "dep:solti-model"]
state    = ["dep:solti-core", "dep:solti-model"]

[dependencies]
prometheus = { workspace = true }
taskvisor  = { workspace = true, features = ["controller"] }
tracing    = { workspace = true }
itoa       = { workspace = true }

axum       = { workspace = true, optional = true }
tokio      = { workspace = true, optional = true, features = ["net", "rt"] }
tokio-util = { workspace = true, optional = true }

solti-runner   = { workspace = true }
solti-model    = { workspace = true, optional = true }
solti-discover = { workspace = true, optional = true }
solti-api      = { workspace = true, optional = true }
solti-core     = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
