[package]
name = "solti-observe"
description = "Solti SDK structured logging, timezone sync, and task-lifecycle subscriber."

rust-version.workspace = true
repository.workspace = true
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
timezone-sync = ["dep:taskvisor", "dep:tokio-util", "dep:solti-model"]
subscriber = ["dep:taskvisor", "dep:async-trait"]

[dependencies]
async-trait = { workspace = true, optional = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
taskvisor = { workspace = true, optional = true, features = ["controller"] }
time = { workspace = true, features = ["formatting", "local-offset"] }
thiserror = { workspace = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

solti-model = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }

[package.metadata.docs.rs]
features = ["subscriber", "timezone-sync"]
